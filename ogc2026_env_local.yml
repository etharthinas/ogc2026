# Local dev environment (macOS) — trimmed from ogc2026_env.yml.
# Keeps every package the solver / bench / alg_tester actually import, at the
# same versions as the evaluation server. Omits (disk): jupyterlab, notebook,
# ipympl, openjdk, dotnet-runtime, torch, torchvision, tensorflow, keras,
# gymnasium, gurobipy, xpress (commercial, unlicensed locally; the solver only
# uses ortools CP-SAT). If you need one of those, install it into this env.
# Official results.csv rows are still recorded on the Windows bench machine.
name: ogc2026
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - matplotlib=3.10.1
  - pandas=2.2.3
  - networkx=3.4.2
  - scipy=1.15.2
  - scikit-learn=1.6.1
  - numba=0.61.0
  - cython=3.0.10
  - pyqt6=6.11.0
  - psutil
  - pip:
    - ortools==9.15.6755
    - shapely>=2.1.0
